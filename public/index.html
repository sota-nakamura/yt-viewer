<!DOCTYPE html>
<html lang="ja">
  <head>
    <title>a</title>
    <meta content="#FFFFFF" name="theme-color" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta charset="utf-8" />
    <link rel="icon" href="https://cdn.glitch.global/8bb51c5a-37a7-4245-ab85-9c8371735b39/favicon.ico" sizes="256x256" />
    <link href="https://cdn.jsdelivr.net/npm/beercss@latest/dist/cdn/beer.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Round" rel="stylesheet" />
    <style>
      body {
        scroll-behavior: smooth;
      }

      .iframe {
        height: 600px;
      }

      article {
        width: 100% !important;
      }

      input {
        width: 100% !important;
        display: block !important;
      }

      .max {
        width: 100% !important;
      }

      .field {
        position: relative;
      }

      .enterBtn {
        position: absolute;
        right: 15px;
      }

      .field>input {
        padding-right: 72px;
      }
    </style>
  </head>
  <body>
    <header class="header fixed">
      <nav>
        <img src="https://cdn.glitch.global/8bb51c5a-37a7-4245-ab85-9c8371735b39/favicon.ico" class="circle icon" />
        <h5 class="max">CodePals</h5>
        <div class="max field border round">
          <input __gchrome_uniqueid="198" name="url" placeholder="URLを入力" />
          <a class="large circle enterBtn" onclick="GetYoutube(urlInput.value)">
            <i>search</i>
          </a>
        </div>
        <a class="wave circle" onclick="removeURL()">
          <i>cancel</i>
        </a>
      </nav>
    </header>
    <main class="responsive">
      <div class="large-space"></div>
      <div class="max">
        <article class="middle-align center-align surface no-elevate">
          <div>
            <i class="extra">play_circle</i>
            <h5>Youtube見るツール by Satoimo_satosi</h5>
            <p>めっちゃ軽いよ！</p>
            <div class="space"></div>
          </div>
        </article>
        <h5>履歴</h5>
        <ul class="history"> Loading </ul>
      </div>
      <iframe src="" class="iframe small-round max" frameborder="0" allowfullscreen></iframe>
    </main>
    <dialog id="dialog">
      <h5>動画視聴の前に</h5>
      <div class="message"></div>
      <nav class="right-align">
        <button class="border" onclick="cancel()">キャンセル</button>
        <button onclick="closeDialog()" class="btn">続ける</button>
      </nav>
    </dialog>
    <dialog id="settings">
      <nav>
        <h5 class="max">カラー設定</h5>
        <button class="circle transparent" data-ui="#settings">
          <i>close</i>
        </button>
      </nav>
      <nav class="wrap" id="theme_list">
        <button class="chip circle">
          <i>palette</i>
          <input type="color" name="theme">
        </button>
        <button class="chip circle">
          <i>upload</i>
          <input type="file" accept="image/*" onclick="changeColor(this.value)">
        </button>
        <button class="circle small red"></button>
        <button class="circle small pink"></button>
        <button class="circle small purple"></button>
        <button class="circle small deep-purple"></button>
        <button class="circle small indigo"></button>
        <button class="circle small blue"></button>
        <button class="circle small light-blue"></button>
        <button class="circle small cyan"></button>
        <button class="circle small teal"></button>
        <button class="circle small green"></button>
        <button class="circle small light-green"></button>
        <button class="circle small lime"></button>
        <button class="circle small yellow"></button>
        <button class="circle small amber"></button>
        <button class="circle small orange"></button>
        <button class="circle small deep-orange"></button>
        <button class="circle small brown"></button>
      </nav>
      <div class="space"></div>
      <div class="field middle-align">
        <nav class="wrap">
          <div class="max">
            <h6>テーマ設定</h6>
          </div>
          
          <nav class="no-space" id="mode_list">
            <button class="border left-round" name="dark">
              <i>dark_mode</i>
            </button>
            <button class="border no-round" name="">
              <i>contrast</i>
            </button>
            <button class="border right-round" name="light">
              <i>light_mode</i>
            </button>
          </nav>
        </nav>
      </div>
    </dialog>
    <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@latest/dist/cdn/beer.min.js"></script>
    <script src="js/attempt.js"></script>
    <script src="js/player.js"></script>
    <script src="js/theme.js"></script>
  </body>
</html>
